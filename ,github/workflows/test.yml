name: Automated Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Upgrade pip
      run: python -m pip install --upgrade pip setuptools wheel

    - name: Install package
      working-directory: ./python
      run: pip install -e .

    - name: Install test dependencies
      run: pip install pytest pytest-cov pytest-mock requests

    - name: Verify package import
      run: python scripts/verify_import.py

    - name: Run unit tests
      continue-on-error: true
      working-directory: ./python
      run: |
        if [ -d "../tests" ]; then
          PYTHONPATH=$PYTHONPATH:$(pwd) python -m pytest ../tests/ -v --tb=short --disable-warnings
        else
          echo "⚠️ No tests directory found."
        fi

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip

    - name: Install package
      working-directory: ./python
      run: |
        pip install -e .
        pip install requests

    - name: Test basic functionality
      run: python scripts/integration_check.py

    - name: Test example scripts
      continue-on-error: true
      run: |
        echo "Checking example scripts..."
        if [ -d "examples" ]; then
          for example in examples/*.py; do
            if [ -f "$example" ]; then
              echo "Checking $example..."
              python -m py_compile "$example" && echo "  ✅ Syntax OK" || echo "  ⚠️ Syntax error in $example"
            fi
          done
        fi

  test-summary:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()

    steps:
    - name: Generate test summary
      run: |
        cat > test-summary.md << 'EOF'
        # Test Summary
        **Repository:** ${{ github.repository }}
        **Commit:** ${{ github.sha }}
        ## Test Results
        | Test Suite | Status |
        |------------|--------|
        | Unit Tests | ${{ needs.unit-tests.result }} |
        | Integration Tests | ${{ needs.integration-tests.result }} |
        **Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        EOF

    - name: Upload test summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-summary
        path: test-summary.md
        retention-days: 7
