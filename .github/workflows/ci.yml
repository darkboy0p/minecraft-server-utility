name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:

  # ============================================================
  # Python Package CI
  # ============================================================

  python-ci:

    name: Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    timeout-minutes: 10

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Setup Python
      # ----------------------------------------------------------

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip


      # ----------------------------------------------------------
      # Upgrade pip
      # ----------------------------------------------------------

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel


      # ----------------------------------------------------------
      # Install package
      # ----------------------------------------------------------

      - name: Install package
        working-directory: ./python
        run: |
          python -m pip install -e .


      # ----------------------------------------------------------
      # Install development dependencies
      # ----------------------------------------------------------

      - name: Install development dependencies
        run: |
          python -m pip install \
            "pytest>=7.0.0" \
            "pytest-cov>=4.0.0" \
            "flake8>=6.0.0" \
            "build>=0.10.0"


      # ----------------------------------------------------------
      # Verify package import
      # ----------------------------------------------------------

      - name: Verify package import
        working-directory: ./python
        run: |
          python - <<'PY'
          import minecraft_server_utility

          print("✅ Package imported successfully")
          print(
              "Version:",
              getattr(
                  minecraft_server_utility,
                  "__version__",
                  "unknown"
              )
          )
          PY


      # ----------------------------------------------------------
      # Lint
      # ----------------------------------------------------------

      - name: Lint with flake8
        run: |
          python -m flake8 python/ \
            --count \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics


      # ----------------------------------------------------------
      # Run tests
      # ----------------------------------------------------------

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ -v
          else
            echo "⚠️ No tests directory found."
          fi


      # ----------------------------------------------------------
      # Build package
      # ----------------------------------------------------------

      - name: Build package
        working-directory: ./python
        run: |
          python -m build


      # ----------------------------------------------------------
      # Verify package
      # ----------------------------------------------------------

      - name: Verify package
        working-directory: ./python
        run: |
          echo "========================================"
          echo "Package files"
          echo "========================================"

          ls -lah dist/

          python -m pip install twine

          python -m twine check dist/*

          echo ""
          echo "✅ Python package build successful"
          echo "✅ Package verification successful"


  # ============================================================
  # Java CI
  # ============================================================

  java-ci:

    name: Java ${{ matrix.java-version }}

    runs-on: ubuntu-latest

    timeout-minutes: 10

    strategy:
      fail-fast: false

      matrix:
        java-version:
          - "11"
          - "17"

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Check whether Java project exists
      # ----------------------------------------------------------

      - name: Check Java project
        id: java-check
        run: |
          if [ -f "java/pom.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Java Maven project found"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No java/pom.xml found"
          fi


      # ----------------------------------------------------------
      # Setup Java
      # ----------------------------------------------------------

      - name: Set up JDK ${{ matrix.java-version }}
        if: steps.java-check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven


      # ----------------------------------------------------------
      # Build Java project
      # ----------------------------------------------------------

      - name: Build with Maven
        if: steps.java-check.outputs.exists == 'true'
        working-directory: ./java
        run: |
          mvn -B clean compile


      # ----------------------------------------------------------
      # Verify Java build
      # ----------------------------------------------------------

      - name: Verify Java build
        if: steps.java-check.outputs.exists == 'true'
        working-directory: ./java
        run: |
          echo "========================================"
          echo "Java build output"
          echo "========================================"

          ls -la target/

          echo ""
          echo "✅ Java build successful for JDK ${{ matrix.java-version }}"


      # ----------------------------------------------------------
      # Skip Java if not present
      # ----------------------------------------------------------

      - name: Java project not found
        if: steps.java-check.outputs.exists == 'false'
        run: |
          echo "⚠️ Java project not found."
          echo "Skipping Java build."


  # ============================================================
  # Documentation
  # ============================================================

  docs:

    name: Generate Documentation

    runs-on: ubuntu-latest

    needs:
      - python-ci
      - java-ci

    if: success()

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Setup Python
      # ----------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ----------------------------------------------------------
      # Install package
      # ----------------------------------------------------------

      - name: Install package
        working-directory: ./python
        run: |
          python -m pip install --upgrade pip
          python -m pip install .


      # ----------------------------------------------------------
      # Install documentation tools
      # ----------------------------------------------------------

      - name: Install documentation tools
        run: |
          python -m pip install pdoc3


      # ----------------------------------------------------------
      # Generate Python documentation
      # ----------------------------------------------------------

      - name: Generate Python documentation
        run: |
          mkdir -p docs/python

          python -m pdoc \
            --html \
            python/minecraft_server_utility \
            --output-dir docs/python \
            --force


      # ----------------------------------------------------------
      # Generate Java documentation if available
      # ----------------------------------------------------------

      - name: Check Java documentation
        id: java-doc-check
        run: |
          if [ -f "java/pom.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi


      - name: Set up JDK
        if: steps.java-doc-check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven


      - name: Generate Java documentation
        if: steps.java-doc-check.outputs.exists == 'true'
        working-directory: ./java
        run: |
          mvn -B javadoc:javadoc

          mkdir -p ../docs/java

          if [ -d "target/site/apidocs" ]; then
            cp -r target/site/apidocs/* ../docs/java/
          fi


      # ----------------------------------------------------------
      # Upload documentation
      # ----------------------------------------------------------

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/
          retention-days: 7


  # ============================================================
  # Test Report
  # ============================================================

  test-report:

    name: Test Report

    runs-on: ubuntu-latest

    needs:
      - python-ci
      - java-ci

    if: always()

    steps:

      - name: Generate test report
        run: |
          echo "# Test Results" > test-report.md
          echo "" >> test-report.md

          echo "Commit: ${{ github.sha }}" >> test-report.md
          echo "" >> test-report.md

          echo "## Jobs" >> test-report.md
          echo "" >> test-report.md

          echo "- Python CI: ${{ needs.python-ci.result }}" >> test-report.md
          echo "- Java CI: ${{ needs.java-ci.result }}" >> test-report.md
          echo "" >> test-report.md

          echo "Run completed: $(date -u)" >> test-report.md


      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.md
          retention-days: 7
