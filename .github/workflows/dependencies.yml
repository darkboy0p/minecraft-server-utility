name: Dependencies

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'python/requirements.txt'
      - 'java/pom.xml'

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Create version.py
      run: |
        mkdir -p python/minecraft_server_utility
        echo '"""Version info"""' > python/minecraft_server_utility/version.py
        echo '__version__ = "1.0.0"' >> python/minecraft_server_utility/version.py

    - name: Update Python deps
      working-directory: ./python
      run: |
        pip install pip-tools
        if [ ! -f requirements.txt ]; then
          echo "requests>=2.25.0" > requirements.txt
        fi

    - name: Check changes
      id: changes
      working-directory: ./python
      run: |
        if git diff --exit-code requirements.txt 2>/dev/null; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Create PR
      if: steps.changes.outputs.has_changes == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore(deps): update dependencies"
        title: "📦 Dependency updates"
        body: "Updated Python dependencies"
        branch: "dependencies-update"
        delete-branch: true
