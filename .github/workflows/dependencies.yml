name: Dependencies

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'python/requirements.txt'
      - 'python/requirements-dev.txt'
      - 'java/pom.xml'

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository_owner != 'dependabot[bot]'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Update Python dependencies
      working-directory: ./python
      run: |
        echo "🔍 Checking Python dependencies..."
        
        # Ensure version.py exists
        if [ ! -f "minecraft_server_utility/version.py" ]; then
          echo "Creating version.py..."
          cat > minecraft_server_utility/version.py << 'EOF'
        """Version information for minecraft-server-utility."""
        __version__ = "1.0.0"
        EOF
        fi
        
        # Install pip-tools
        pip install pip-tools
        
        # Create requirements.in if it doesn't exist
        if [ ! -f "requirements.in" ]; then
          echo "📝 Creating requirements.in..."
          if [ -f "requirements.txt" ]; then
            cp requirements.txt requirements.in
          else
            echo "requests>=2.25.0" > requirements.in
          fi
        fi
        
        # Update requirements.txt
        echo "🔄 Updating requirements.txt..."
        pip-compile --upgrade requirements.in -o requirements.txt --resolver=backtracking 2>/dev/null || {
          echo "⚠️ pip-compile failed, checking existing requirements..."
          if [ ! -f "requirements.txt" ]; then
            echo "requests>=2.25.0" > requirements.txt
          fi
        }
        
        echo "✅ Python dependencies updated"
    
    - name: Check for Python dependency changes
      id: py-changes
      working-directory: ./python
      run: |
        if [ -f "requirements.txt" ] && ! git diff --exit-code requirements.txt 2>/dev/null; then
          echo "Python dependencies have changed"
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "No Python dependency changes"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Check Java project
      id: java-check
      run: |
        if [ -f "java/pom.xml" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "✅ Java Maven project found"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "⚠️ Java Maven project not found"
        fi
    
    - name: Setup Java
      if: steps.java-check.outputs.exists == 'true'
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    
    - name: Update Java dependencies
      if: steps.java-check.outputs.exists == 'true'
      working-directory: ./java
      run: |
        echo "🔍 Checking Java dependencies..."
        
        cp pom.xml pom.xml.backup 2>/dev/null || true
        
        mvn versions:update-properties -DgenerateBackupPoms=false 2>/dev/null || true
        mvn versions:use-latest-versions -DgenerateBackupPoms=false -DallowSnapshots=false 2>/dev/null || true
        
        if ! git diff --exit-code pom.xml 2>/dev/null; then
          echo "✅ Java dependencies updated"
        else
          echo "ℹ️ No Java dependency updates"
        fi
    
    - name: Check for Java dependency changes
      id: java-changes
      if: steps.java-check.outputs.exists == 'true'
      working-directory: ./java
      run: |
        if [ -f "pom.xml" ] && ! git diff --exit-code pom.xml 2>/dev/null; then
          echo "Java dependencies have changed"
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "No Java dependency changes"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Configure Git
      if: steps.py-changes.outputs.has_changes == 'true' || steps.java-changes.outputs.has_changes == 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Create Pull Request
      if: steps.py-changes.outputs.has_changes == 'true' || steps.java-changes.outputs.has_changes == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore(deps): update dependencies"
        title: "📦 Dependency updates"
        body: |
          ## 📦 Dependency Updates
          
          | Package | Status |
          |---------|--------|
          | Python Dependencies | ${{ steps.py-changes.outputs.has_changes == 'true' && '🔄 Updated' || '✅ Up to date' }} |
          | Java Dependencies | ${{ steps.java-changes.outputs.has_changes == 'true' && '🔄 Updated' || '✅ Up to date' }} |
          
          **Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        labels: "dependencies, automated-pr"
        branch: "dependencies-update"
        delete-branch: true
        draft: false
    
    - name: No changes needed
      if: steps.py-changes.outputs.has_changes == 'false' && steps.java-changes.outputs.has_changes == 'false'
      run: echo "✅ No dependency updates needed"
