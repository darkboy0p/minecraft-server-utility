name: Dependencies

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight
  workflow_dispatch:  # Allow manual triggering
  push:
    branches:
      - main
    paths:
      - 'python/requirements.txt'
      - 'python/requirements-dev.txt'
      - 'java/pom.xml'

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository_owner != 'dependabot[bot]'
    
    steps:
    # ============================================================
    # Checkout
    # ============================================================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    # ============================================================
    # Python Setup
    # ============================================================
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    # ============================================================
    # Update Python Dependencies
    # ============================================================
    - name: Update Python dependencies
      working-directory: ./python
      run: |
        echo "🔍 Checking Python dependencies..."
        
        # Install pip-tools
        pip install pip-tools
        
        # Create requirements.in if it doesn't exist
        if [ ! -f "requirements.in" ]; then
          echo "📝 Creating requirements.in from current requirements.txt..."
          if [ -f "requirements.txt" ]; then
            cat requirements.txt > requirements.in
          else
            echo "requests>=2.25.0" > requirements.in
          fi
        fi
        
        # Update requirements.txt
        echo "🔄 Updating requirements.txt..."
        pip-compile --upgrade requirements.in -o requirements.txt --resolver=backtracking
        
        # Update dev requirements if they exist
        if [ -f "requirements-dev.in" ]; then
          echo "🔄 Updating requirements-dev.txt..."
          pip-compile --upgrade requirements-dev.in -o requirements-dev.txt --resolver=backtracking
        elif [ -f "requirements-dev.txt" ]; then
          echo "📝 Creating requirements-dev.in from existing requirements-dev.txt..."
          cat requirements-dev.txt > requirements-dev.in
          pip-compile --upgrade requirements-dev.in -o requirements-dev.txt --resolver=backtracking
        fi
        
        echo "✅ Python dependencies updated"
        
    - name: Check for Python dependency changes
      id: py-changes
      working-directory: ./python
      run: |
        if git diff --exit-code requirements.txt; then
          echo "No Python dependency changes"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "Python dependencies have changed"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "📊 Changes in requirements.txt:"
          git diff requirements.txt | head -20
        fi
    
    # ============================================================
    # Java Setup
    # ============================================================
    - name: Check Java project
      id: java-check
      run: |
        if [ -f "java/pom.xml" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "✅ Java Maven project found"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "⚠️ Java Maven project not found"
        fi
    
    - name: Setup Java
      if: steps.java-check.outputs.exists == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    
    # ============================================================
    # Update Java Dependencies
    # ============================================================
    - name: Update Java dependencies with Maven
      if: steps.java-check.outputs.exists == 'true'
      working-directory: ./java
      run: |
        echo "🔍 Checking Java dependencies..."
        
        # Backup original pom.xml
        cp pom.xml pom.xml.backup
        
        # Update dependencies using versions-maven-plugin
        echo "🔄 Updating Maven dependencies..."
        mvn versions:update-properties -DgenerateBackupPoms=false
        
        # Update specific dependencies
        mvn versions:use-latest-versions \
          -DgenerateBackupPoms=false \
          -DexcludeReactor=true \
          -DprocessDependencyManagement=true \
          -DallowSnapshots=false \
          -Dincludes="org.json:json" || true
        
        # Check if there are changes
        if ! git diff --exit-code pom.xml; then
          echo "✅ Java dependencies updated"
        else
          echo "ℹ️ No Java dependency updates available"
        fi
        
    - name: Check for Java dependency changes
      id: java-changes
      if: steps.java-check.outputs.exists == 'true'
      working-directory: ./java
      run: |
        if git diff --exit-code pom.xml; then
          echo "No Java dependency changes"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "Java dependencies have changed"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "📊 Changes in pom.xml:"
          git diff pom.xml | head -30
        fi
    
    # ============================================================
    # Skip Java if not present
    # ============================================================
    - name: Java project not found
      if: steps.java-check.outputs.exists == 'false'
      run: |
        echo "⚠️ No Java project found."
        echo "Skipping Java dependency update."
    
    # ============================================================
    # Create Pull Request if changes exist
    # ============================================================
    - name: Create Pull Request
      if: steps.py-changes.outputs.has_changes == 'true' || steps.java-changes.outputs.has_changes == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore(deps): update dependencies"
        title: "📦 Dependency updates"
        body: |
          ## 📦 Dependency Updates
          
          This PR updates the project dependencies to their latest versions.
          
          ### 🔍 Summary
          
          | Package | Status |
          |---------|--------|
          | Python Dependencies | ${{ steps.py-changes.outputs.has_changes == 'true' && '🔄 Updated' || '✅ Up to date' }} |
          | Java Dependencies | ${{ steps.java-changes.outputs.has_changes == 'true' && '🔄 Updated' || '✅ Up to date' }} |
          
          ### 📝 Changes
          
          <details>
          <summary>Click to view changes</summary>
          
          ${{ steps.py-changes.outputs.has_changes == 'true' && '**Python dependencies updated:**' || '' }}
          ${{ steps.py-changes.outputs.has_changes == 'true' && '```diff' || '' }}
          ${{ steps.py-changes.outputs.has_changes == 'true' && git diff python/requirements.txt || '' }}
          ${{ steps.py-changes.outputs.has_changes == 'true' && '```' || '' }}
          
          ${{ steps.java-changes.outputs.has_changes == 'true' && '**Java dependencies updated:**' || '' }}
          ${{ steps.java-changes.outputs.has_changes == 'true' && '```diff' || '' }}
          ${{ steps.java-changes.outputs.has_changes == 'true' && git diff java/pom.xml || '' }}
          ${{ steps.java-changes.outputs.has_changes == 'true' && '```' || '' }}
          
          </details>
          
          ### ✅ How to review
          1. ✅ Check that all tests pass
          2. ✅ Verify compatibility with existing code
          3. ✅ Ensure no breaking changes
          4. ✅ Review the diff for any unexpected changes
          
          ### 🤖 Automation
          **This PR was automatically generated by GitHub Actions**
          
          **Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        labels: "dependencies, automated-pr"
        branch: "dependencies-update"
        delete-branch: true
        draft: false
        author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
        committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
    
    # ============================================================
    # No changes needed
    # ============================================================
    - name: No changes needed
      if: steps.py-changes.outputs.has_changes == 'false' && steps.java-changes.outputs.has_changes == 'false'
      run: |
        echo "✅ No dependency updates needed"
        echo "All dependencies are up to date!"
