name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish package
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine setuptools wheel

    - name: Create version.py if missing
      run: |
        mkdir -p python/minecraft_server_utility
        if [ ! -f "python/minecraft_server_utility/version.py" ]; then
          echo '"""Version information for minecraft-server-utility."""' > python/minecraft_server_utility/version.py
          echo '__version__ = "1.0.0"' >> python/minecraft_server_utility/version.py
        fi
        cat python/minecraft_server_utility/version.py

    - name: Verify files exist
      run: |
        ls -la python/
        ls -la python/minecraft_server_utility/
        cat python/setup.py | grep version || echo "✅"

    - name: Build package
      working-directory: ./python
      run: |
        python -m build
        ls -lah dist/

    - name: Check package
      working-directory: ./python
      run: |
        python -m twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: ./python/dist/
