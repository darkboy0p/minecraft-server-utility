name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Create version.py
      run: |
        mkdir -p python/minecraft_server_utility
        echo '"""Version info"""' > python/minecraft_server_utility/version.py
        echo '__version__ = "1.0.0"' >> python/minecraft_server_utility/version.py

    - name: Get version
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Update version
      working-directory: ./python
      run: |
        sed -i "s/__version__ = \".*\"/__version__ = \"${{ steps.version.outputs.VERSION }}\"/" minecraft_server_utility/version.py

    - name: Build
      working-directory: ./python
      run: |
        pip install build
        python -m build

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: python/dist/*
        generate_release_notes: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: ./python/dist/
