name: Security Scan

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:


jobs:

  # ============================================================
  # Python Dependency Security
  # ============================================================

  dependency-check:

    name: Dependency Security Scan

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Setup Python
      # ----------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ----------------------------------------------------------
      # Python dependency scan
      # ----------------------------------------------------------

      - name: Python dependency security scan
        run: |
          echo "🔍 Checking Python dependencies..."

          python -m pip install --upgrade pip

          python -m pip install safety

          if [ -f "python/requirements.txt" ]; then
            echo "📦 Found python/requirements.txt"

            safety check \
              -r python/requirements.txt \
              --output text || true

          elif [ -f "requirements.txt" ]; then
            echo "📦 Found requirements.txt"

            safety check \
              -r requirements.txt \
              --output text || true

          else
            echo "⚠️ No requirements.txt found."

            echo "Checking package metadata instead..."

            if [ -f "python/setup.py" ]; then
              python -m pip install ./python
              python -m pip list
            fi
          fi


      # ----------------------------------------------------------
      # Check Java project
      # ----------------------------------------------------------

      - name: Check Java project
        id: java-check
        run: |
          if [ -f "java/pom.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Java Maven project found"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Java Maven project not found"
          fi


      # ----------------------------------------------------------
      # Setup Java
      # ----------------------------------------------------------

      - name: Set up Java
        if: steps.java-check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven


      # ----------------------------------------------------------
      # OWASP Dependency Check
      # ----------------------------------------------------------

      - name: Install OWASP Dependency-Check
        if: steps.java-check.outputs.exists == 'true'
        working-directory: ./java
        run: |
          echo "📦 Installing OWASP Dependency-Check..."

          VERSION="8.3.1"

          wget -q \
            -O dependency-check.zip \
            "https://github.com/jeremylong/DependencyCheck/releases/download/v${VERSION}/dependency-check-${VERSION}-release.zip"

          unzip -q dependency-check.zip

          rm dependency-check.zip

          mkdir -p reports

          echo "✅ Dependency-Check installed"


      # ----------------------------------------------------------
      # Run OWASP scan
      # ----------------------------------------------------------

      - name: Run Java dependency security scan
        if: steps.java-check.outputs.exists == 'true'
        working-directory: ./java
        run: |
          echo "🔍 Scanning Java dependencies..."

          ./dependency-check/bin/dependency-check.sh \
            --project "minecraft-server-utility" \
            --scan "." \
            --out "./reports" \
            --format HTML \
            --format JSON \
            --failOnCVSS 9 \
            --enableExperimental || true

          echo "✅ Java dependency scan completed"


      # ----------------------------------------------------------
      # Skip Java
      # ----------------------------------------------------------

      - name: Java project not found
        if: steps.java-check.outputs.exists == 'false'
        run: |
          echo "⚠️ No Java project found."
          echo "Skipping Java dependency scan."


      # ----------------------------------------------------------
      # Upload reports
      # ----------------------------------------------------------

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: |
            java/reports/
          retention-days: 7
          if-no-files-found: ignore


  # ============================================================
  # Snyk Security
  # ============================================================

  snyk-security:

    name: Snyk Security Scan

    runs-on: ubuntu-latest

    continue-on-error: true

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Check Snyk token
      # ----------------------------------------------------------

      - name: Check Snyk configuration
        id: snyk-check
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "✅ Snyk token configured"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Snyk token not configured"
            echo "Snyk scans will be skipped."
          fi


      # ----------------------------------------------------------
      # Setup Python
      # ----------------------------------------------------------

      - name: Set up Python
        if: steps.snyk-check.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ----------------------------------------------------------
      # Snyk Python
      # ----------------------------------------------------------

      - name: Run Snyk for Python
        if: steps.snyk-check.outputs.configured == 'true'
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=upgradable
        continue-on-error: true


      # ----------------------------------------------------------
      # Check Java
      # ----------------------------------------------------------

      - name: Check Java project
        if: steps.snyk-check.outputs.configured == 'true'
        id: java-snyk-check
        run: |
          if [ -f "java/pom.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Java Maven project found"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Java Maven project not found"
          fi


      # ----------------------------------------------------------
      # Setup Java
      # ----------------------------------------------------------

      - name: Set up Java
        if: |
          steps.snyk-check.outputs.configured == 'true' &&
          steps.java-snyk-check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven


      # ----------------------------------------------------------
      # Snyk Java
      # ----------------------------------------------------------

      - name: Run Snyk for Java
        if: |
          steps.snyk-check.outputs.configured == 'true' &&
          steps.java-snyk-check.outputs.exists == 'true'
        working-directory: ./java
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=upgradable
        continue-on-error: true


      # ----------------------------------------------------------
      # Snyk Monitor
      # ----------------------------------------------------------

      - name: Snyk Monitor
        if: |
          steps.snyk-check.outputs.configured == 'true' &&
          steps.java-snyk-check.outputs.exists == 'true'
        working-directory: ./java
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
        continue-on-error: true


      # ----------------------------------------------------------
      # Snyk skipped
      # ----------------------------------------------------------

      - name: Snyk not configured
        if: steps.snyk-check.outputs.configured == 'false'
        run: |
          echo "ℹ️ Snyk was skipped."
          echo ""
          echo "To enable Snyk:"
          echo "1. Create a Snyk account"
          echo "2. Create an API token"
          echo "3. Add it to GitHub Secrets as:"
          echo ""
          echo "SNYK_TOKEN"
