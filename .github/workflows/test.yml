name: Automated Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Upgrade pip
      run: python -m pip install --upgrade pip setuptools wheel

    - name: Create version.py if missing
      run: |
        mkdir -p python/minecraft_server_utility
        if [ ! -f "python/minecraft_server_utility/version.py" ]; then
          echo '"""Version information for minecraft-server-utility."""' > python/minecraft_server_utility/version.py
          echo '__version__ = "1.0.0"' >> python/minecraft_server_utility/version.py
        fi

    - name: Install package
      working-directory: ./python
      run: pip install -e .

    - name: Install test dependencies
      run: pip install pytest pytest-cov pytest-mock requests

    - name: Verify package import
      working-directory: ./python
      run: |
        python -c "
import sys
import os
sys.path.insert(0, os.getcwd())
try:
    from minecraft_server_utility import __version__, ServerPinger, MojangAPI
    print(f'✅ Package imported successfully')
    print(f'✅ Version: {__version__}')
except Exception as e:
    print(f'❌ Import failed: {e}')
    sys.exit(1)
"

    - name: Run unit tests
      continue-on-error: true
      working-directory: ./python
      run: |
        if [ -d "../tests" ]; then
          PYTHONPATH=$PYTHONPATH:$(pwd) python -m pytest ../tests/ -v --tb=short --disable-warnings
        else
          echo "⚠️ No tests directory found."
        fi

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip

    - name: Create version.py if missing
      run: |
        mkdir -p python/minecraft_server_utility
        if [ ! -f "python/minecraft_server_utility/version.py" ]; then
          echo '"""Version information for minecraft-server-utility."""' > python/minecraft_server_utility/version.py
          echo '__version__ = "1.0.0"' >> python/minecraft_server_utility/version.py
        fi

    - name: Install package
      working-directory: ./python
      run: |
        pip install -e .
        pip install requests

    - name: Test basic functionality
      working-directory: ./python
      run: |
        python -c "
import sys
import os
sys.path.insert(0, os.getcwd())
try:
    from minecraft_server_utility import ServerPinger, MojangAPI, PlayerUtils
    print('✅ All imports successful')
    pinger = ServerPinger('localhost', 25565, timeout=1)
    print(f'✅ ServerPinger created: {pinger.host}:{pinger.port}')
    api = MojangAPI(timeout=5)
    print('✅ MojangAPI created')
    utils = PlayerUtils()
    print('✅ PlayerUtils created')
    print('\\n✅ All basic tests passed!')
except Exception as e:
    print(f'❌ Test failed: {e}')
    import traceback
    traceback.print_exc()
    exit(1)
"

    - name: Test example scripts
      continue-on-error: true
      working-directory: ./python
      run: |
        echo "Checking example scripts..."
        if [ -d "../examples" ]; then
          for example in ../examples/*.py; do
            if [ -f "$example" ]; then
              echo "Checking $example..."
              python -c "
import sys
try:
    with open('$example', 'r') as f:
        exec(compile(f.read(), '$example', 'exec'), {'__name__': '__main__'})
    print('  ✅ Syntax OK')
except Exception as e:
    print(f'  ⚠️  {type(e).__name__}: {e}')
"
            fi
          done
        fi

  test-summary:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()

    steps:
    - name: Generate test summary
      run: |
        cat > test-summary.md << 'EOF'
        # Test Summary
        **Repository:** ${{ github.repository }}
        **Commit:** ${{ github.sha }}
        ## Test Results
        | Test Suite | Status |
        |------------|--------|
        | Unit Tests | ${{ needs.unit-tests.result }} |
        | Integration Tests | ${{ needs.integration-tests.result }} |
        **Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        EOF

    - name: Upload test summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-summary
        path: test-summary.md
        retention-days: 7
