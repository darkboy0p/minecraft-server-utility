[pytest]
# Test discovery settings
testpaths = tests
pythonpath = python

# Test execution settings
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests

# Python files to consider as tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore paths
norecursedirs = 
    .git
    .tox
    .venv
    venv
    env
    dist
    build
    *.egg-info
